name: Lidl check

# One-off: compares two ways of reading Lidl (no database) and commits the results to
# docs/lidl-check/ on the branch it ran on. Safe to delete afterwards.
on:
  push:
    branches: [claude/peaceful-cray-ur92n4]
    paths: [.github/workflows/lidl-check.yml, .github/scripts/lidl_search_check.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - name: Compare
        run: uv run --no-sync python .github/scripts/lidl_search_check.py
      - name: Commit the results
        if: always()
        run: |
          [ -d docs/lidl-check ] || exit 0
          cat docs/lidl-check/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/lidl-check
          git commit -m "Lidl check results" || exit 0
          git push
