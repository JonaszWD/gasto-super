# Price sources. Each can be enabled/disabled independently; a failing source never stops others.
# Research notes and risks per source: see README "Price sources".

[mercadona]
enabled = true
min_interval_seconds = 1.5     # gap between requests (never parallel)
max_detail_fetches = 400       # product-detail calls per run to backfill EANs (fetched once each)

# Mercadona top-level category ids -> department. Anything not listed is not collected
# (cosmetics, hair care, make-up, parapharmacy, pets, baby hygiene...).
[mercadona.departments]
food = [1, 2, 3, 4, 5, 6, 7, 9, 11, 12, 13, 14, 15, 16, 17]
drink = [8, 10, 18, 19]
household = [26]

# Subcategory overrides: baby *food* only (not nappies or hygiene).
[mercadona.subcategories]
food = [216]

[easycompra]
enabled = true
min_interval_seconds = 1.0
# Lidl left out: its EasyCompra data has no pack sizes (no unit price) and mixes in non-food items.
chains = ["dia", "carrefour"]

[openprices]
enabled = true
min_interval_seconds = 1.0
radius_km = 10
days = 120
max_pages = 20

# Server-rendered shop pages, fetched with a browser User-Agent (the JSON API answers 403).
# No category walk: the catalogue is whatever these searches return (up to 50 hits each).
[alcampo]
enabled = true
min_interval_seconds = 2.0     # pages are 1-2 MB each
# Products per nightly run. Each run continues where the last one stopped, so the term list
# below is covered in rotation (about 60 nights for ~3,000 products). Remove for a full run.
max_products_per_run = 50
search_terms = [
    "leche", "huevos", "yogur", "queso", "mantequilla", "nata", "bebida vegetal",
    "pan", "pan de molde", "harina", "arroz", "pasta", "espaguetis", "macarrones", "garbanzos", "lentejas",
    "alubias", "aceite de oliva", "aceite de girasol", "vinagre", "sal", "azucar", "tomate frito",
    "atun", "sardinas", "mayonesa", "ketchup", "caldo", "sopa",
    "cafe", "cacao", "te", "galletas", "cereales", "mermelada", "miel", "chocolate",
    "pollo", "ternera", "cerdo", "carne picada", "jamon", "jamon cocido", "pavo", "chorizo", "salchichas",
    "salmon", "merluza", "gambas",
    "patatas", "cebolla", "tomate", "lechuga", "zanahoria", "pimiento", "platano", "manzana", "naranja", "limon",
    "pizza", "croquetas", "verduras congeladas", "helado", "gazpacho", "hummus",
    "agua", "refresco", "cola", "zumo", "cerveza", "vino tinto",
    "detergente", "suavizante", "lavavajillas", "lejia", "friegasuelos", "papel higienico", "papel de cocina",
    "bolsas de basura",
]

# Top-level shop category (first element of the product's categoryPath) -> department.
# Anything not listed is not collected (perfumery, baby, parapharmacy, pets, non-food...).
[alcampo.departments]
food = [
    "Frescos", "Leche, Huevos, Lácteos, Yogures y Bebidas vegetales", "Alimentación", "Desayuno y Merienda",
    "Congelados", "Comida Preparada", "Supermercado Ecológico",
    "Sin Gluten / Sin Lactosa, Nutrición deportiva y Funcional", "Veganos",
]
drink = ["Bebidas"]
household = ["Droguería"]

# Storefront REST API, the whole catalogue in pages of 100 (about 90 requests).
[consum]
enabled = true
min_interval_seconds = 1.5
# Products in a category whose name contains one of these words are not collected.
skip_categories = [
    "perfumeria", "higiene", "cosmetica", "maquillaje", "parafarmacia", "farmacia",
    "mascotas", "animales", "perro", "perros", "gato", "gatos", "panales", "bazar", "textil",
]

# Category-name word -> department (first match wins); otherwise guessed from the product name.
[consum.departments]
drink = ["bebidas", "aguas", "refrescos", "cervezas", "vinos", "zumos", "licores", "bodega"]
household = ["drogueria", "limpieza", "detergentes"]
