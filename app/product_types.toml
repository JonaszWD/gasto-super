# Product types: generic names ("Pechuga de pollo") that group specific products from every chain,
# so a search for "chicken" can offer the kinds of chicken and compare their price per kg.
# Read by app/services/product_types.py; products are classified by the collectors
# (`python -m collectors retype` re-applies this file to every product).
#
# Rules match the cleaned product name (no pack size or store brand; lower case, no accents):
#   match    patterns anchored at the START of the name (Spanish names lead with what the product is)
#   exclude  patterns found ANYWHERE in the name that rule the type out (cooked, breaded, snacks...)
#   exclude_categories  text found in the chain's category (normalised the same way)
# Pattern tokens: a word; "word*" = any word starting with it; "~" = up to 3 other words.
#   amount   default amount when a type is added to the shopping list, in the unit its products
#            are priced in (kg, l or units); 1 when left out.
# The first type whose rules match wins, and file order is also the display order.

# Never typed: pet food and baby food use the same words ("sopas de pollo para gatos").
exclude_categories = ["mascota", "gato", "perro", "infantil", "bebe", "potito"]

# Shared by the fresh meat and fish types: prepared, cooked or cured versions are other products.
[sets]
prepared = ["cocid*", "brasead*", "asad*", "lonchas", "fiambre", "empanad*", "rebozad*", "marinad*", "adobad*",
            "relleno*", "curad*", "ahumad*", "kentucky", "nuggets", "crispy", "barbacoa", "teriyaki", "curry",
            "salsa", "pechuguita*", "tacos", "cocinad*", "hamburguesa*"]
prepared_categories = ["jamon cocido", "charcuteria", "embutido", "platos preparados", "empanados", "rebozados",
                       "elaborados", "conserva", "ahumados", "precocinados"]

# ---------------------------------------------------------------- chicken
[types.pollo-entero]
es = "Pollo entero"
en = "Whole chicken"
match = ["pollo* ~ entero*", "pollo* ~ limpio*", "pollo para asar"]
exclude = ["@prepared", "medio", "picanton"]
exclude_categories = ["@prepared_categories"]

[types.pechuga-de-pollo]
es = "Pechuga de pollo"
en = "Chicken breast"
match = ["pechuga* ~ de pollo", "pechuga* pollo", "pechuga* de pollo", "filete* de pechuga* ~ de pollo",
         "filete* de pechuga* pollo"]
exclude = ["@prepared", "natural", "troceada", "hierbas"]
exclude_categories = ["@prepared_categories"]

[types.muslos-de-pollo]
es = "Muslos de pollo"
en = "Chicken thighs"
